<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Полярная карта неба</title>
  <script src="https://slowe.github.io/VirtualSky/virtualsky.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #000; color: #fff; }
    #controls { margin: 20px; }
    input { margin: 5px; padding: 5px; }
    #starmap { width: 100%; height: 600px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Полярная карта звёздного неба</h1>

  <div id="controls">
    <label>Широта: <input type="number" id="latitude" value="55.75" step="0.01"></label>
    <label>Долгота: <input type="number" id="longitude" value="37.62" step="0.01"></label>
    <label>Дата и время (UTC): <input type="datetime-local" id="datetime" value="2025-08-25T14:04"></label>
    <button onclick="updateSky()">Обновить карту</button>
  </div>

  <div id="starmap"></div>

  <script>
    let sky;

    function updateSky() {
      const lat = parseFloat(document.getElementById('latitude').value);
      const lon = parseFloat(document.getElementById('longitude').value);
      const datetime = document.getElementById('datetime').value;

      if (sky) {
        document.getElementById('starmap').innerHTML = '';
      }

      sky = new VirtualSky({
        id: 'starmap',
        latitude: lat,
        longitude: lon,
        projection: 'polar',
        constellations: true,
        gridlines_az: true,
        gridlines_eq: true,
        planets: true,
        showdate: datetime,
        live: false
      });
    }

    window.onload = updateSky;
  </script>
</body>
</html>
