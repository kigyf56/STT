<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VirtualSky Planetarium</title>
    <script src="lco.virtualsky.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #starmap { width: 600px; height: 600px; border: 1px solid #ccc; }
        #controls { margin-bottom: 20px; }
        label { margin-right: 10px; }
        input { margin-right: 20px; padding: 5px; }
        button { padding: 5px 10px; }
    </style>
</head>
<body>
    <div id="controls">
        <label for="latitude">Latitude:</label>
        <input type="number" id="latitude" value="51.5074" step="0.0001" min="-90" max="90">
        <label for="longitude">Longitude:</label>
        <input type="number" id="longitude" value="-0.1278" step="0.0001" min="-180" max="180">
        <label for="datetime">Date & Time:</label>
        <input type="datetime-local" id="datetime">
        <button onclick="updateStarMap()">Update Map</button>
    </div>
    <div id="starmap"></div>

    <script>
        // Initialize VirtualSky with default settings
        let virtualsky = VirtualSky({
            id: 'starmap',
            projection: 'polar', // Set polar projection by default
            latitude: 51.5074,   // Default: London
            longitude: -0.1278,  // Default: London
            clock: new Date(),   // Current time
            showstars: true,
            showplanets: true,
            showconstellations: true,
            showconstellationlabels: true,
            showgridlines: true
        });

        // Function to update the star map based on user input
        function updateStarMap() {
            const latitude = parseFloat(document.getElementById('latitude').value);
            const longitude = parseFloat(document.getElementById('longitude').value);
            const datetimeInput = document.getElementById('datetime').value;

            // Validate inputs
            if (isNaN(latitude) || latitude < -90 || latitude > 90) {
                alert('Please enter a valid latitude (-90 to 90).');
                return;
            }
            if (isNaN(longitude) || longitude < -180 || longitude > 180) {
                alert('Please enter a valid longitude (-180 to 180).');
                return;
            }
            if (!datetimeInput) {
                alert('Please select a valid date and time.');
                return;
            }

            // Update VirtualSky settings
            virtualsky.setLatitude(latitude);
            virtualsky.setLongitude(longitude);
            virtualsky.setClock(new Date(datetimeInput));
            virtualsky.draw(); // Redraw the map
        }

        // Set default datetime input to current time
        document.getElementById('datetime').value = new Date().toISOString().slice(0, 16);
    </script>
</body>
</html>
