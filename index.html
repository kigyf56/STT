<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>карта</title>
  <link rel="stylesheet" href="VirtualSky/virtualsky.css">
  <script src="VirtualSky/virtualsky.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 20px; }
    #starmap { width: 100%; height: 500px; margin: 20px auto; border: 1px solid #ccc; }
    form { margin-bottom: 20px; }
    input { margin: 5px; }
  </style>
</head>
<body>
  <h1>Карта</h1>

  <form id="settings">
    Широта: <input type="number" id="lat" value="0" step="0.01"><br>
    Долгота: <input type="number" id="lon" value="0" step="0.01"><br>
    Дата и время: <input type="datetime-local" id="datetime"><br>
    <button type="submit">Обновить</button>
  </form>

  <div id="starmap"></div>

  <script>
    // Инициализация VirtualSky
    const sky = new VirtualSky({
      id: 'starmap',
      width: 800,
      height: 500,
      latitude: 0,
      longitude: 0,
      date: new Date(),
      projection: 'stereo',
      constellation_labels: true
    });

    sky.draw();

    // Обработчик формы
    document.getElementById('settings').addEventListener('submit', function(e) {
      e.preventDefault(); // чтобы страница не перезагружалась

      const lat = parseFloat(document.getElementById('lat').value);
      const lon = parseFloat(document.getElementById('lon').value);
      const dtInput = document.getElementById('datetime').value;
      const dt = dtInput ? new Date(dtInput) : new Date();

      sky.latitude = lat;
      sky.longitude = lon;
      sky.date = dt;

      sky.draw(); // перерисовываем карту
    });
  </script>
</body>
</html>
